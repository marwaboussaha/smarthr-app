name: CI/CD DevSecOps SmartHR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # ÉTAPE 1 : TESTS ET SÉCURITÉ DU CODE
  # ─────────────────────────────────────────────────────────────
  tests-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, gd, zip
          tools: composer:v2

      # On précise le dossier uniquement pour les commandes PHP/Composer
      - name: Install Dependencies
        working-directory: ./backend
        run: composer install --no-progress --prefer-dist

      - name: Prepare Laravel Application
        working-directory: ./backend
        run: |
          cp .env.example .env || echo "Pas de fichier .env.example"
          php artisan key:generate

      - name: Run PHPUnit Tests
        working-directory: ./backend
        run: php artisan test

      - name: Dependency Security Scan (OWASP)
        working-directory: ./backend
        run: composer audit

  # ─────────────────────────────────────────────────────────────
  # ÉTAPE 2 : BUILD, SÉCURITÉ DES IMAGES (TRIVY) ET PUSH
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    needs: tests-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # Mis à jour en v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build & Scan Backend
      - name: Build Backend for Scan
        run: docker build -t smarthr-backend:local -f Dockerfiles/app/backend/Dockerfile .

      - name: Run Trivy Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smarthr-backend:local'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Push final de toutes les images
      - name: Build & Push All Images
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          SHA=${{ github.sha }}
          
          # Backend
          docker tag smarthr-backend:local $REGISTRY/smarthr-backend:$SHA
          docker tag smarthr-backend:local $REGISTRY/smarthr-backend:latest
          docker push $REGISTRY/smarthr-backend --all-tags
          
          # Web (React)
          docker build -t $REGISTRY/smarthr-web:$SHA -f Dockerfiles/web/Dockerfile .
          docker tag $REGISTRY/smarthr-web:$SHA $REGISTRY/smarthr-web:latest
          docker push $REGISTRY/smarthr-web --all-tags

          # Redis & Agent (Ajoutez les vôtres ici si nécessaire)
          # ... (mêmes étapes docker build/tag/push pour Redis et Agent)

  # ─────────────────────────────────────────────────────────────
  # ÉTAPE 3 : DÉPLOIEMENT SUR AWS ECS
  # ─────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS Services
        run: |
          aws ecs update-service --cluster smarthr --service smarthr-app-service --force-new-deployment
          aws ecs update-service --cluster smarthr --service smarthr-cache-service --force-new-deployment