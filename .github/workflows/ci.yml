name: CI/CD DevSecOps SmartHR

concurrency:
group: ${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

on:
push:
branches: [ main ]
pull_request:
branches: [ main ]

permissions:
actions: read
contents: read
security-events: write

jobs:

# ============================================================

# 1. TESTS & SÉCURITÉ

# ============================================================

tests-and-security:
runs-on: ubuntu-latest

```
defaults:
  run:
    working-directory: backend

steps:
  - name: Checkout code
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Setup PHP
    uses: shivammathur/setup-php@v2
    with:
      php-version: '8.3'
      extensions: pdo_mysql, mbstring, bcmath, gd, zip
      tools: composer:v2

  - name: Install Dependencies
    run: composer install --no-progress --prefer-dist

  - name: Prepare Laravel Application
    run: |
      if [ -f .env.example ]; then
        cp .env.example .env
      else
        touch .env
      fi

      php artisan key:generate --force

  - name: Run PHPUnit Tests
    env:
      APP_ENV: testing
      APP_KEY: base64:6pGByYpt6pGByYpt6pGByYpt6pGByYpt6pGByYpt6pG=
    run: php artisan test

  - name: Dependency Security Scan (OWASP)
    continue-on-error: true
    run: composer audit
```

# ============================================================

# 2. BUILD + TRIVY + PUSH ECR

# ============================================================

build-and-push:
needs: tests-and-security
runs-on: ubuntu-latest


if: github.ref == 'refs/heads/main' && github.event_name == 'push'

outputs:
  backend_image: ${{ steps.meta.outputs.backend_image }}
  web_image: ${{ steps.meta.outputs.web_image }}
  agent_image: ${{ steps.meta.outputs.agent_image }}
  redis_image: ${{ steps.meta.outputs.redis_image }}

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v2
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: us-east-1

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Compute Image Tags
    id: meta
    run: |
      REGISTRY="${{ steps.login-ecr.outputs.registry }}"
      SHA="${{ github.sha }}"

      echo "backend_image=${REGISTRY}/smarthr-backend:${SHA}" >> $GITHUB_OUTPUT
      echo "web_image=${REGISTRY}/smarthr-web:${SHA}" >> $GITHUB_OUTPUT
      echo "agent_image=${REGISTRY}/smarthr-agent:${SHA}" >> $GITHUB_OUTPUT
      echo "redis_image=${REGISTRY}/smarthr-redis:${SHA}" >> $GITHUB_OUTPUT

  - name: Build Backend Image
    run: |
      docker build \
        -t smarthr-backend:local \
        -f Dockerfiles/app/backend/Dockerfile .

  - name: Run Trivy Scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: smarthr-backend:local
      format: table
      severity: CRITICAL,HIGH
      exit-code: '0'

  - name: Build & Push All Images
    run: |
      # Backend
      docker tag smarthr-backend:local ${{ steps.meta.outputs.backend_image }}
      docker tag smarthr-backend:local ${{ steps.login-ecr.outputs.registry }}/smarthr-backend:latest
      docker push ${{ steps.login-ecr.outputs.registry }}/smarthr-backend --all-tags

      # Web
      docker build -t ${{ steps.meta.outputs.web_image }} \
        -f Dockerfiles/web/Dockerfile .

      docker tag ${{ steps.meta.outputs.web_image }} \
        ${{ steps.login-ecr.outputs.registry }}/smarthr-web:latest

      docker push ${{ steps.login-ecr.outputs.registry }}/smarthr-web --all-tags

      # Redis
      docker build -t ${{ steps.meta.outputs.redis_image }} \
        -f Dockerfiles/cache/Dockerfile .

      docker tag ${{ steps.meta.outputs.redis_image }} \
        ${{ steps.login-ecr.outputs.registry }}/smarthr-redis:latest

      docker push ${{ steps.login-ecr.outputs.registry }}/smarthr-redis --all-tags

      # Agent
      docker build -t ${{ steps.meta.outputs.agent_image }} \
        -f Dockerfiles/agent/Dockerfile .

      docker tag ${{ steps.meta.outputs.agent_image }} \
        ${{ steps.login-ecr.outputs.registry }}/smarthr-agent:latest

      docker push ${{ steps.login-ecr.outputs.registry }}/smarthr-agent --all-tags


# ============================================================

# 3. DEPLOY ECS

# ============================================================

deploy:
runs-on: ubuntu-latest
needs: build-and-push


steps:
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v2
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: us-east-1

  - name: Deploy App Service
    run: |
      aws ecs update-service \
        --cluster smarthr \
        --service smarthr-app-service \
        --force-new-deployment \
        --region us-east-1

  - name: Deploy Cache Service
    run: |
      aws ecs update-service \
        --cluster smarthr \
        --service smarthr-cache-service \
        --force-new-deployment \
        --region us-east-1

  - name: Deploy Agent Service
    run: |
      aws ecs update-service \
        --cluster smarthr \
        --service smarthr-agent-service \
        --force-new-deployment \
        --region us-east-1

  - name: Wait For Stabilization
    run: |
      aws ecs wait services-stable \
        --cluster smarthr \
        --services \
        smarthr-app-service \
        smarthr-cache-service \
        smarthr-agent-service \
        --region us-east-1